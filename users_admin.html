<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universearch | Gestion des Utilisateurs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="univ_admi_uni.css">
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-['Plus_Jakarta_Sans']">

    <!-- Page Loader with Blur Effect -->
    <div id="page-loader" class="fixed inset-0 z-[9999] bg-[#F8FAFC] flex items-center justify-center transition-all duration-500">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-600 font-medium">Chargement en cours...</p>
        </div>
    </div>

    <!-- Main Content with Initial Blur -->
    <div id="main-content" class="filter blur-sm transition-all duration-500 opacity-0">

    <div id="toast-container" class="fixed top-10 left-1/2 -translate-x-1/2 z-[100] pointer-events-none flex flex-col items-center gap-3"></div>

<div class="min-h-screen bg-[#F8FAFC] text-slate-900 p-8">

    <div id="toast-container" class="fixed top-10 left-1/2 -translate-x-1/2 z-[100] pointer-events-none flex flex-col items-center gap-3"></div>

    <div class="max-w-7xl mx-auto">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight" id="page-title">Répertoire Utilisateur</h1>
            <p class="text-slate-500 mt-2 font-medium" id="page-subtitle">Gérez les accès et consultez les détails des utilisateurs inscrits.</p>
            
            <!-- Selector Mode Controls -->
            <div id="selector-controls" class="hidden mt-4 flex items-center gap-4">
                <button onclick="confirmSelection()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Confirmer la sélection (<span id="selected-count">0</span>)
                </button>
                <button onclick="window.close()" class="px-6 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-all">Annuler</button>
            </div>
        </div>

                <div class="bg-white rounded-[32px] border border-slate-100 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/30">
                        <div class="relative w-72">
                            <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </span>
                            <input type="text" id="user-search" placeholder="Rechercher un utilisateur..." class="w-full pl-12 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        </div>

                        <div class="flex items-center gap-3">
                            <select id="user-filter" class="px-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20">
                                <option value="all">Tous les types</option>
                                <option value="utilisateur">Utilisateur</option>
                                <option value="etudiant">Étudiant</option>
                                <option value="bachelier">Bachelier</option>
                                <option value="parent">Parent</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50">
                                    <th id="checkbox-header" class="hidden px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">
                                        <input type="checkbox" id="select-all" onchange="toggleSelectAll()" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                                    </th>
                                    <th class="px-8 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Nom et Prénom</th>
                                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Date de naissance</th>
                                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Type</th>
                                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Email</th>
                                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Téléphone</th>
                                    <th class="px-8 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- Users will be loaded here -->
                            </tbody>
                        </table>
                    </div>

                    <div class="p-6 border-t border-slate-50 bg-slate-50/30">
                        <div class="flex items-center justify-between">
                            <p class="text-sm text-slate-500">
                                Affichage de <span id="users-showing">0</span> sur <span id="users-total">0</span> utilisateurs
                            </p>
                            <div class="flex items-center gap-2">
                                <button id="prev-page" onclick="changePage(currentPage - 1)" class="px-3 py-1.5 text-sm bg-white border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">Précédent</button>
                                <span id="current-page" class="px-3 py-1.5 text-sm font-medium">1</span>
                                <button id="next-page" onclick="changePage(currentPage + 1)" class="px-3 py-1.5 text-sm bg-white border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">Suivant</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- User Modal -->
    <div id="user-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="relative min-h-screen flex items-center justify-center p-4">
            <div class="relative bg-white w-full max-w-2xl rounded-[32px] shadow-2xl overflow-hidden modal-content">
                <div class="relative h-32 bg-gradient-to-r from-indigo-600 to-violet-600">
                    <button onclick="closeModal()" class="absolute top-4 right-4 p-2 bg-white/20 hover:bg-white/30 rounded-full text-white transition-all">&times;</button>
                </div>
                <div class="px-8 pb-8">
                    <div class="relative flex justify-between items-end -mt-12 mb-6">
                        <div class="flex items-end gap-4">
                            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-slate-100 to-slate-200 p-1">
                                <div class="w-full h-full rounded-2xl bg-slate-300 flex items-center justify-center">
                                    <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                </div>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-slate-900" id="modal-title">Nouveau Utilisateur</h3>
                                <p class="text-slate-500 text-sm">Ajoutez un nouvel utilisateur au système</p>
                            </div>
                        </div>
                    </div>
                    <form id="user-form" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-3">
                                <label class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">Prénom</label>
                                <input type="text" id="user-prenom" name="prenom" required class="w-full px-5 py-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                            </div>
                            <div class="space-y-3">
                                <label class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">Nom</label>
                                <input type="text" id="user-nom" name="nom" required class="w-full px-5 py-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">Email</label>
                            <input type="email" id="user-email" name="email" required class="w-full px-5 py-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-3">
                                <label class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">Rôle</label>
                                <select id="user-role" name="role" required class="w-full px-5 py-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                    <option value="">Sélectionner un rôle</option>
                                    <option value="student">Étudiant</option>
                                    <option value="admin">Administrateur</option>
                                    <option value="university_staff">Personnel Université</option>
                                    <option value="center_staff">Personnel Centre</option>
                                </select>
                            </div>
                            <div class="space-y-3">
                                <label class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">Statut</label>
                                <select id="user-status" name="status" required class="w-full px-5 py-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                                    <option value="active">Actif</option>
                                    <option value="inactive">Inactif</option>
                                    <option value="pending">En attente</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex gap-3 pt-4">
                            <button type="button" onclick="closeModal()" class="flex-1 px-5 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Annuler</button>
                            <button type="submit" class="flex-1 px-5 py-3 rounded-xl font-bold text-sm bg-indigo-600 text-white hover:bg-indigo-700 transition-all">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    </div> <!-- End of main-content -->

    <script src="users_admin.js"></script>

    <script>
        // Page Loading Effect
        window.addEventListener('load', function() {
            const loader = document.getElementById('page-loader');
            const mainContent = document.getElementById('main-content');

            // Fade out loader
            loader.style.opacity = '0';

            // Remove blur and show content
            setTimeout(() => {
                mainContent.classList.remove('filter', 'blur-sm');
                mainContent.classList.add('opacity-100');

                // Remove loader after transition
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 300);
        });

        // Fallback: Remove loader after 3 seconds max
        setTimeout(() => {
            const loader = document.getElementById('page-loader');
            const mainContent = document.getElementById('main-content');

            if (loader && mainContent) {
                loader.style.display = 'none';
                mainContent.classList.remove('filter', 'blur-sm');
                mainContent.classList.add('opacity-100');
            }
        }, 3000);
    </script>
</body>
</html>
